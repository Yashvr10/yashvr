<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<link rel="stylesheet" href="lib/fw.css">
<script src="lib/gsap.min.js"></script>

<title>Title</title>
<style>
  body { background: #000; }
  #wrap { position: absolute; left: 0; right: 0; top: 360px; text-align: center; }
  #a { font-size: 60px; opacity: 0; color: rgba(255,255,255,.75); text-shadow: none; }
  #b { font-size: 170px; opacity: 0; line-height: 1; margin-top: 10px; }
</style>
</head>
<body>
<div id="wrap" class="kin"><div id="a">if you’re not living</div><div id="b">the life you <span class="scr">want</span></div></div>
<script type="module">
import { play } from "./lib/fw.js";
const tl = gsap.timeline({ paused: true });
tl.set("#a", { opacity: 1 }, 0.4);
tl.set("#b", { opacity: 1 }, 1.1);
tl.to("#wrap", { opacity: 0, duration: 0.6 }, 6 - 0.8);
tl.to({}, { duration: 6 }, 0);
play(tl, { duration: 6 });
</script>
</body>
</html>
