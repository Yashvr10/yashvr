<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<link rel="stylesheet" href="lib/fw.css">
<script src="lib/gsap.min.js"></script>

<title>Title</title>
<style>
  body { background: #000; }
  .rise { position: absolute; left: 0; right: 0; top: 60px; text-align: center; opacity: 0; font-size: 560px; line-height: .85; transform: scaleX(.62); }
  #b { position: absolute; left: 0; right: 0; top: 640px; text-align: center; opacity: 0; font-size: 70px; }
  #b .scr { font-size: 200px; vertical-align: -40px; }
</style>
</head>
<body>
<div class="rise emph" id="r1">RISE</div><div class="rise emph" id="r2">RISE</div><div class="rise emph" id="r3">RISE</div>
<div id="b" class="quiet">above the <span class="scr">ordinary</span></div>
<script type="module">
import { play } from "./lib/fw.js";
const tl = gsap.timeline({ paused: true });
// each "RISE" cuts in on its hit (kicks at 0.5, 1.4, 2.3 s) and replaces the one before
[["#r1", 0.5, 1.4], ["#r2", 1.4, 2.3], ["#r3", 2.3, null]].forEach(([el, a, b]) => { tl.set(el, { opacity: 1 }, a); if (b) tl.set(el, { opacity: 0 }, b); });
tl.set("#b", { opacity: 1 }, 2.9);
tl.to(["#r3", "#b"], { opacity: 0, duration: 0.4 }, 5 - 0.5);
tl.to({}, { duration: 5 }, 0);
play(tl, { duration: 5 });
</script>
</body>
</html>
