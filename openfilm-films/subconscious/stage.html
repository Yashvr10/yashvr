  const pics = (g.pics || []).map((p) => { const i = document.createElement("img"); i.src = p.src; Object.assign(i.style, { left: p.x + "px", top: p.y + "px", width: p.w + "px", height: p.h + "px" }); e.append(i); imgs.push(i); return [i, p.at]; });
  items.push({ at: g.at, end: g.end, el: e, frame(t) { for (const [i, a] of pics) i.style.display = t >= a ? "block" : "none"; } });
}
for (const m of D.emph) { const e = mk("emph"); const d = mk("", e); d.textContent = m.text; items.push({ at: m.at, end: m.end, el: e }); }
for (const c of D.chaps) {
  const e = mk("chap"); const b = mk("b", e), a = mk("a", e);
  const L = [];
  const fill = (el, txt, t0, seed) => [...txt].forEach((ch, j) => { const s = document.createElement("span"); s.textContent = ch; el.append(s);
    L.push([s, t0 + hash(j + 1, seed) * 0.8]); });
  fill(a, c.a, 0.1, c.seed); fill(b, c.b, 0.95, c.seed + 7);
  items.push({ at: c.at, end: c.end, el: e, frame(t) { const lt = t - c.at;
    for (const [s, st] of L) { const k = (lt - st) / 0.38; s.style.opacity = k < 0 ? 0 : k >= 1 ? 1 : (0.32 + 0.68 * k).toFixed(3); }
    e.style.opacity = c.end - t < 0.12 ? 0 : 1; } });
}
for (const c of D.caps) {
  const e = mk("cap" + (c.dark ? " dark" : ""));
  const W = c.words.map((w, i) => { if (i) e.append(" "); const s = document.createElement("span"); s.textContent = w.x; e.append(s); return [s, w.t]; });
  items.push({ at: c.at, end: c.end, el: e, frame(t) { for (const [s, a] of W) s.style.visibility = t >= a ? "visible" : "hidden"; } });
}
for (const r of D.rects) { const e = mk("rect"); Object.assign(e.style, { left: r.x + "px", top: r.y + "px", width: r.w + "px", height: r.h + "px", background: r.c }); items.push({ at: r.at, end: r.end, el: e }); }
window.film = {
  ready: Promise.all([document.fonts.ready, ...imgs.map((i) => i.decode().catch(() => {}))]),
  frame(t) {
    for (const o of items) {
      const on = t >= o.at && t < o.end;
      o.el.style.display = on ? (o.disp || "block") : "none";
      if (on && o.frame) o.frame(t);
    }
  },
};
</script>
</body>
