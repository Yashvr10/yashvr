<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>Stage</title>
<style>
  @font-face { font-family: "IT"; src: url("fonts/InterTight.ttf"); font-weight: 100 900; }
  @font-face { font-family: "Bebas"; src: url("fonts/BebasNeue.ttf"); }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
  .layer { position: absolute; inset: 0; display: none; }
  /* light grey paper card (reel DezFTyktEUp) */
  .grey { background: #c9c9c7; }
  .grey::after { content: ""; position: absolute; inset: 0; background-image: var(--paper); opacity: .5; }
  .grid img { position: absolute; object-fit: cover; display: none; filter: grayscale(.85) contrast(1.08); }
  .black { background: #000; }
  /* emphasis: huge white Bebas, one word at a time (Video-43179) */
  .emph { display: none; position: absolute; inset: 0; background: #000; }
  .emph div { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); text-align: center;
              font-family: "Bebas"; color: #fff; font-size: 230px; line-height: .9; letter-spacing: .01em; white-space: nowrap; }
  /* chapter: small white word in front of a huge red word, letters fading in at random ("rishot4rx.") */
  .chap { display: none; position: absolute; inset: 0; background: #000; }
  .chap .b { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); text-align: center; font-family: "Bebas";
             color: #e1050a; font-size: 330px; line-height: .9; letter-spacing: .02em; white-space: nowrap; }
  .chap .a { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); text-align: center; font-family: "Bebas";
             color: #fff; font-size: 120px; line-height: .9; letter-spacing: .06em; white-space: nowrap; }
  .chap span { opacity: 0; }
  /* normal captions (reel DezFTyktEUp): small clean sans, sentence case, words spread across one line, each popping on */
  .cap { display: none; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); justify-content: space-between;
         font-family: "IT"; font-weight: 400; font-size: 52px; color: #fff; white-space: nowrap; text-shadow: 0 2px 14px rgba(0,0,0,.75), 0 0 3px rgba(0,0,0,.6); }
  .cap.dark { color: #111; text-shadow: none; }
  .cap span { visibility: hidden; }
  .rect { display: none; position: absolute; }
</style>
</head>
<body>
<div id="root"></div>
<script>
const D = {{data}};
const root = document.getElementById("root");
const mk = (cls, parent = root) => { const e = document.createElement("div"); e.className = cls; parent.append(e); return e; };
// paper grain for the grey cards, from a seeded hash so every frame is the same however it is reached
const hash = (i, s) => { let h = (i * 374761393 + s * 668265263) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };
{ const c = document.createElement("canvas"); c.width = c.height = 256; const x = c.getContext("2d"), im = x.createImageData(256, 256);
  for (let i = 0; i < 65536; i++) { const v = hash(i, 3); im.data[i * 4] = im.data[i * 4 + 1] = im.data[i * 4 + 2] = v < .5 ? 0 : 255; im.data[i * 4 + 3] = Math.abs(v - .5) * 60; }
  x.putImageData(im, 0, 0); document.documentElement.style.setProperty("--paper", `url(${c.toDataURL()})`); }
const imgs = [];
const items = [];
for (const g of D.cards) {            // grey cards and grid collages
  const e = mk("layer grey grid");
  const pics = (g.pics || []).map((p) => { const i = document.createElement("img"); i.src = p.src; Object.assign(i.style, { left: p.x + "px", top: p.y + "px", width: p.w + "px", height: p.h + "px" }); e.append(i); imgs.push(i); return [i, p.at]; });
  items.push({ at: g.at, end: g.end, el: e, frame(t) { for (const [i, a] of pics) i.style.display = t >= a ? "block" : "none"; } });
}
for (const m of D.emph) { const e = mk("emph"); const d = mk("", e); d.textContent = m.text; items.push({ at: m.at, end: m.end, el: e }); }
for (const c of D.chaps) {
  const e = mk("chap"); const b = mk("b", e), a = mk("a", e);
  const L = [];
  const fill = (el, txt, t0, seed) => [...txt].forEach((ch, j) => { const s = document.createElement("span"); s.textContent = ch; el.append(s);
    L.push([s, t0 + hash(j + 1, seed) * 0.8]); });
  fill(a, c.a, 0.1, c.seed); fill(b, c.b, 0.95, c.seed + 7);
  items.push({ at: c.at, end: c.end, el: e, frame(t) { const lt = t - c.at;
    for (const [s, st] of L) { const k = (lt - st) / 0.38; s.style.opacity = k < 0 ? 0 : k >= 1 ? 1 : (0.32 + 0.68 * k).toFixed(3); }
    e.style.opacity = c.end - t < 0.12 ? 0 : 1; } });
}
for (const c of D.caps) {
  const e = mk("cap" + (c.dark ? " dark" : "")); e.style.width = c.width + "px";
  const W = c.words.map((w) => { const s = document.createElement("span"); s.textContent = w.x; e.append(s); return [s, w.t]; });
  items.push({ at: c.at, end: c.end, el: e, disp: "flex", frame(t) { for (const [s, a] of W) s.style.visibility = t >= a ? "visible" : "hidden"; } });
}
for (const r of D.rects) { const e = mk("rect"); Object.assign(e.style, { left: r.x + "px", top: r.y + "px", width: r.w + "px", height: r.h + "px", background: r.c }); items.push({ at: r.at, end: r.end, el: e }); }
window.film = {
  ready: Promise.all([document.fonts.ready, ...imgs.map((i) => i.decode().catch(() => {}))]),
  frame(t) {
    for (const o of items) {
      const on = t >= o.at && t < o.end;
      o.el.style.display = on ? (o.disp || "block") : "none";
      if (on && o.frame) o.frame(t);
    }
  },
};
</script>
</body>
</html>
