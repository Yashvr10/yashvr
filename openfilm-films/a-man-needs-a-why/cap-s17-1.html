<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<link rel="stylesheet" href="lib/fw.css">
<script src="lib/gsap.min.js"></script>

<title>Then it is gone.</title>
<style>
  /* a single line, centred low on the picture, as in the reference */
  #c { position: absolute; left: 160px; right: 160px; bottom: 110px; text-align: center; font-size: 46px; font-weight: 500; color: var(--ivory);
       text-shadow: 0 2px 18px rgba(0,0,0,.85), 0 0 3px rgba(0,0,0,.6); opacity: 0; }
</style>
</head>
<body><div id="c" class="corm">Then it is gone.</div>
<script type="module">
import { play } from "./lib/fw.js";
const L = 2.63, tl = gsap.timeline({ paused: true });
tl.fromTo("#c", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.9, ease: "power2.out" }, 0.2);
tl.to("#c", { opacity: 0, duration: 0.7, ease: "power1.in" }, L - 0.8);
tl.to({}, { duration: L }, 0);
play(tl, { duration: L });
</script></body></html>
