{{head}}
<title>Title</title>
<style>
  body { background: #0b0a08; }
  #t { position: absolute; left: 0; right: 0; top: 470px; text-align: center; font-size: 44px; color: var(--ivory); opacity: 0; }
  #r { position: absolute; left: 860px; width: 200px; top: 560px; height: 1px; background: var(--gold); transform-origin: 50% 50%; }
</style>
</head>
<body>
<div id="t" class="caps">The Man Who Can’t Be Broken</div>
<div id="r"></div>
<script type="module">
import { play } from "./lib/fw.js";
const tl = gsap.timeline({ paused: true });
gsap.set("#r", { scaleX: 0 });
tl.fromTo("#t", { opacity: 0, letterSpacing: ".46em" }, { opacity: 1, letterSpacing: ".3em", duration: 2.6, ease: "power2.out" }, 0.3);
tl.to("#r", { scaleX: 1, duration: 1.4, ease: "power3.out" }, 1.3);
tl.to(["#t", "#r"], { opacity: 0, duration: 0.8 }, {{len}} - 0.9);
tl.to({}, { duration: {{len}} }, 0);
play(tl, { duration: {{len}} });
</script>
</body>
</html>
