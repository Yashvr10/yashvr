<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<link rel="stylesheet" href="lib/fw.css">
<script src="lib/gsap.min.js"></script>

<script src="lib/d3.min.js"></script>
<script src="lib/topojson-client.min.js"></script>
<style>body { background: var(--ground); } svg { position: absolute; inset: 0; width: 1920px; height: 1080px; }</style>

<title>West, 1940</title>
</head>
<body>
<svg id="map"><defs><marker id="head" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b8322a"/></marker></defs></svg>
<script type="module">
import { play, europe, ISO, pin, label, line, chrome } from "./lib/fw.js";
const tl = gsap.timeline({ paused: true });
const ready = (async () => {
  const m = await europe(document.getElementById("map"), { view: [[-3, 46.5], [13, 58.5]] });
  m.paths[ISO.germany].style.fill = "var(--central)";
  const head = chrome(document.body, { kicker: "April – June 1940", title: "The fall of the West", note: "Today's borders. Routes simplified." });
  head.in(tl, 0.1);
  const D = 4.05, N = 8.37, A = 12.49;
  ["denmark", "norway"].forEach((k, i) => tl.to(m.paths[ISO[k]], { fill: "#5a2e26", duration: 0.5 }, D + i * 0.5));
  const north = [[[9.5, 54.4], [9.6, 55.8]], [[10.5, 55.2], [9.8, 57.6], [9.5, 59.3]]].map((p) => line(m.overlay, m, p, { stroke: "var(--poppy)", "stroke-width": 6, "stroke-linecap": "round", "marker-end": "url(#head)" }));
  north.forEach((a, i) => tl.to(a, { strokeDashoffset: 0, duration: 1.0, ease: "power2.out" }, D + i * 0.3));
  const low = [[[7.0, 52.3], [5.2, 52.1]], [[6.3, 50.9], [4.5, 50.8], [3.3, 50.7]]].map((p) => line(m.overlay, m, p, { stroke: "var(--poppy)", "stroke-width": 7, "stroke-linecap": "round", "marker-end": "url(#head)" }));
  low.forEach((a, i) => tl.to(a, { strokeDashoffset: 0, duration: 1.2, ease: "power2.out" }, N + i * 0.3));
  const sickle = line(m.overlay, m, [[6.6, 50.1], [5.3, 49.75], [4.3, 49.75], [3.0, 49.9], [1.8, 50.1]], { stroke: "var(--poppy)", "stroke-width": 10, "stroke-linecap": "round", "marker-end": "url(#head)" });
  const ard = label(m.overlay, m, [5.6, 49.35], "ARDENNES", { size: 15, ls: ".2em", fill: "var(--paper)" });
  tl.to(ard, { opacity: 1, duration: 0.3 }, A - 0.2);
  tl.to(sickle, { strokeDashoffset: 0, duration: 2.0, ease: "power2.inOut" }, A);
  const dk = pin(m.overlay, m, [2.38, 51.03], "Dunkirk", { size: 26, dx: -16, anchor: "end" });
  const pa = pin(m.overlay, m, [2.35, 48.86], "Paris", { size: 26, dx: -16, anchor: "end" });
  tl.to(pa.g, { opacity: 1, duration: 0.4 }, 0.5);
  tl.to(dk.g, { opacity: 1, duration: 0.4 }, A + 1.6);
  tl.to({}, { duration: 14 }, 0);
})();
play(tl, { ready });
</script>
</body>
</html>
