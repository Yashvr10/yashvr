<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<link rel="stylesheet" href="lib/fw.css">
<script src="lib/gsap.min.js"></script>

<title>The Holocaust</title>
<style>
  /* No counting, no bounce: the number is simply there. */
  body { background: var(--ink); }
  #wrap { position: absolute; left: 0; right: 0; top: 300px; text-align: center; }
  #n { font-size: 210px; font-weight: 900; line-height: 1.1; opacity: 0; }
  #u { font-size: 30px; color: var(--dim); margin-top: 20px; opacity: 0; }
  #t { font-size: 44px; font-style: italic; margin-top: 70px; opacity: 0; }
  #a { position: absolute; left: 0; right: 0; bottom: 110px; text-align: center; font-size: 26px; color: var(--dim); opacity: 0; }
</style>
</head>
<body>
<div id="wrap">
  <div id="n" class="serif">6,000,000</div>
  <div id="u" class="label">Jews murdered in the Holocaust</div>
  <div id="t" class="serif">two thirds of Europe's Jews</div>
</div>
<div id="a" class="mono">Auschwitz: more than 1.1 million people killed</div>
<script type="module">
import { play } from "./lib/fw.js";
const tl = gsap.timeline({ paused: true });
tl.to("#n", { opacity: 1, duration: 1.4, ease: "sine.out" }, Math.max(0.2, 0.5 - 0.3));
tl.to("#u", { opacity: 1, duration: 1.0 }, 0.5 + 0.6);
tl.to("#t", { opacity: 1, duration: 1.2 }, 1.74);
tl.to("#a", { opacity: 1, duration: 1.0 }, 5.22);
tl.to({}, { duration: 14 }, 0);
play(tl, { ready: Promise.resolve() });
</script>
</body>
</html>
