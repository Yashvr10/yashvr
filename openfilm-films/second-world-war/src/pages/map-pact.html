{{maphead}}
<title>The pact</title>
</head>
<body>
<svg id="map"></svg>
<script type="module">
import { play, europe, ISO, label, line, chrome } from "./lib/fw.js";
const tl = gsap.timeline({ paused: true });
const ready = (async () => {
  const m = await europe(document.getElementById("map"), { view: [[4, 44], [42, 60]] });
  const head = chrome(document.body, { kicker: "23 August 1939", title: "A secret deal", note: "Today's borders. The line across Poland is approximate." });
  head.in(tl, 0.1);
  const G = {{cue:pact}}, S = {{cue:secret}};
  tl.to(m.paths[ISO.germany], { fill: "var(--central)", duration: 0.5 }, Math.max(0.3, G - 0.6));
  ["russia", "belarus", "ukraine"].forEach((k) => tl.to(m.paths[ISO[k]], { fill: "var(--soviet)", duration: 0.5 }, G));
  tl.to(m.paths[ISO.poland], { fill: "var(--land-hi)", duration: 0.5 }, G + 0.3);
  const lg = label(m.overlay, m, [10.3, 51.0], "GERMANY", { size: 22, fill: "var(--paper)", ls: ".16em" });
  const ls = label(m.overlay, m, [33, 55.2], "SOVIET UNION", { size: 22, fill: "var(--paper)", ls: ".16em" });
  const lp = label(m.overlay, m, [19.2, 52.1], "POLAND", { size: 20, fill: "var(--paper)", ls: ".2em" });
  tl.to([lg, ls], { opacity: 1, duration: 0.4 }, G + 0.2);
  tl.to(lp, { opacity: 1, duration: 0.4 }, G + 0.5);
  const cut = line(m.overlay, m, [[22.8, 54.4], [22.1, 53.3], [22.6, 52.4], [23.6, 52.1], [24.0, 51.0], [23.9, 50.4], [22.7, 49.6], [22.6, 49.1]],
    { stroke: "var(--poppy)", "stroke-width": 5, "stroke-dasharray": "0", "stroke-linecap": "round" });
  tl.to(cut, { strokeDashoffset: 0, duration: 1.4, ease: "power2.inOut" }, S);
  const D = {{cue:divide}};
  tl.to(lp, { opacity: 0, duration: 0.3 }, D);
  const w = label(m.overlay, m, [19.0, 52.4], "→ GERMANY", { size: 17, fill: "var(--paper)", ls: ".12em" });
  const e = label(m.overlay, m, [25.6, 52.6], "SOVIET UNION ←", { size: 17, fill: "var(--paper)", ls: ".12em" });
  tl.to([w, e], { opacity: 1, duration: 0.4 }, D + 0.1);
  tl.to({}, { duration: 14 }, 0);
})();
play(tl, { ready });
</script>
</body>
</html>
