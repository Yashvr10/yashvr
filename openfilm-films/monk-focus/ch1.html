<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<link rel="stylesheet" href="lib/fw.css">
<script src="lib/gsap.min.js"></script>

<title>Chapter</title>
<style>
  body { background: #000; }
  #wrap { position: absolute; left: 0; right: 0; top: 400px; text-align: center; }
  #num { font-size: 44px; opacity: 0; letter-spacing: -.02em; color: rgba(255,255,255,.7); text-shadow: none; }
  #name { font-size: 130px; opacity: 0; margin-top: 18px; line-height: 1; }
</style>
</head>
<body>
<div id="wrap" class="kin"><div id="num">one</div><div id="name">the noonday <span class="scr">demon</span></div></div>
<script type="module">
import { play } from "./lib/fw.js";
const tl = gsap.timeline({ paused: true });
tl.set("#num", { opacity: 1 }, 0.2);
tl.set("#name", { opacity: 1 }, 0.55);
tl.to("#wrap", { opacity: 0, duration: 0.3 }, 4 - 0.4);
tl.to({}, { duration: 4 }, 0);
play(tl, { duration: 4 });
</script>
</body>
</html>
