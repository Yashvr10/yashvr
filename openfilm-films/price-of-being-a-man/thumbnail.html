<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:IS;src:url(fonts/InstrumentSerif.ttf)}
@font-face{font-family:EBG;src:url(fonts/EBGaramond.ttf)}
html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#0b0705}
.bg{position:absolute;left:-330px;top:0;width:1280px;height:720px;background:url(thumb/oldman.jpg) 50% 40%/cover;filter:brightness(1.25) contrast(1.15) saturate(1.05)}
.vig{position:absolute;inset:0;background:linear-gradient(90deg,transparent 30%,rgba(8,5,3,.9) 62%,#080503 100%),radial-gradient(ellipse at 25% 45%,transparent 30%,rgba(0,0,0,.6) 90%)}
.t{position:absolute;left:640px;width:600px;text-align:center;color:#f1e6d2;text-shadow:0 6px 40px rgba(0,0,0,.9)}
.a{top:170px;font-family:EBG;font-size:48px;letter-spacing:.35em;text-transform:uppercase;opacity:.9}
.b{top:225px;font-family:IS;font-size:150px;line-height:1;letter-spacing:.02em}
.c{top:385px;font-family:IS;font-size:190px;line-height:1;color:#e2b45e}
</style></head><body><div class="bg"></div><div class="vig"></div>
<div class="t a">The price</div><div class="t b">of being</div><div class="t c">a man</div></body></html>
