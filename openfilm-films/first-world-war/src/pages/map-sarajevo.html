{{maphead}}
<title>Sarajevo</title>
</head>
<body>
<svg id="map"></svg>
<script type="module">
import { play, europe, ISO, pin, label, cam, chrome } from "./lib/fw.js";
const tl = gsap.timeline({ paused: true });
const ready = (async () => {
  const m = await europe(document.getElementById("map"), { view: [[-6, 36], [36, 60]] });
  for (const k of ["austria", "hungary", "czechia", "slovakia", "slovenia", "croatia", "bosnia"]) m.paths[ISO[k]].style.fill = "var(--land-hi)";
  m.paths[ISO.bosnia].style.fill = "#4a3a2e";
  const ah = label(m.overlay, m, [18.6, 46.5], "AUSTRIA-HUNGARY", { size: 15, ls: ".2em" });
  const sr = label(m.overlay, m, [21.0, 43.7], "SERBIA", { size: 15, ls: ".2em" });
  const s = pin(m.overlay, m, [18.41, 43.86], "Sarajevo", { size: 16, dx: -12, dy: -14, anchor: "end", sub: "28 June 1914" });
  const head = chrome(document.body, { kicker: "28 June 1914", title: "A shot in Sarajevo" });
  head.in(tl, 0.1);
  tl.to(m.g, { ...cam(m, [[13.5, 41.2], [23.5, 47.6]]), duration: 2.4, ease: "power2.inOut" }, 0.2);
  tl.to([ah, sr], { opacity: 1, duration: 0.6 }, 1.4);
  tl.to(s.g, { opacity: 1, duration: 0.4 }, 1.7);
  tl.fromTo(s.ring, { attr: { r: 8 } }, { attr: { r: 40 }, opacity: 0, duration: 1.2, ease: "power2.out" }, {{cue:shot}});
  tl.to({}, { duration: 6 }, 0);
})();
play(tl, { ready });
</script>
</body>
</html>
