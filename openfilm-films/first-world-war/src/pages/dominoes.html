{{head}}
<title>Five weeks to war</title>
<style>
  body { background: var(--ink); }
  #rows { position: absolute; left: 300px; top: 250px; }
  .row { display: flex; align-items: center; height: 112px; opacity: 0; }
  .tile { width: 26px; height: 74px; border: 3px solid var(--paper); border-radius: 4px; margin-right: 54px; transform-origin: 0% 100%; position: relative; }
  .tile::after { content: ""; position: absolute; left: 3px; right: 3px; top: 33px; height: 3px; background: var(--paper); }
  .date { width: 250px; font-size: 30px; color: var(--poppy); letter-spacing: .06em; }
  .what { font-size: 50px; font-weight: 700; }
  .what em { font-style: normal; color: var(--dim); font-weight: 700; }
</style>
</head>
<body>
<div style="position:absolute;left:300px;top:96px">
  <div class="label" id="kicker" style="font-size:22px;color:var(--poppy)">July – August 1914</div>
  <div class="serif" id="title" style="font-size:64px;font-weight:700;margin-top:10px">Five weeks to war</div>
</div>
<div id="rows">
  <div class="row" id="r1"><div class="tile"></div><div class="date mono">28 JULY</div><div class="what serif">Austria-Hungary <em>→</em> Serbia</div></div>
  <div class="row" id="r2"><div class="tile"></div><div class="date mono">30 JULY</div><div class="what serif">Russia mobilises</div></div>
  <div class="row" id="r3"><div class="tile"></div><div class="date mono">1 AUGUST</div><div class="what serif">Germany <em>→</em> Russia</div></div>
  <div class="row" id="r4"><div class="tile"></div><div class="date mono">3 AUGUST</div><div class="what serif">Germany <em>→</em> France</div></div>
  <div class="row" id="r5"><div class="tile"></div><div class="date mono">4 AUGUST</div><div class="what serif">Germany invades Belgium</div></div>
  <div class="row" id="r6"><div class="tile"></div><div class="date mono">4 AUGUST</div><div class="what serif">Britain <em>→</em> Germany</div></div>
</div>
<script type="module">
import { play } from "./lib/fw.js";
const tl = gsap.timeline({ paused: true });
const cues = [{{cue:declared}}, {{cue:mobilised}}, {{cue:russia#2}}, {{cue:france}}, {{cue:marched}}, {{cue:britain}}];
gsap.set(".row", { x: -40 });
cues.forEach((c, i) => {
  const at = Math.max(0.2, c - 0.15);
  tl.to(`#r${i + 1}`, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, at);
  // the tile before this one tips over: one domino knocks the next
  if (i > 0) tl.to(`#r${i} .tile`, { rotation: -72, duration: 0.35, ease: "power2.in" }, at - 0.1);
});
tl.to(`#r6 .tile`, { rotation: -72, duration: 0.35, ease: "power2.in" }, cues[5] + 1.6);
tl.to("#rows", { y: -6, duration: 20, ease: "none" }, 0);
play(tl, { ready: Promise.resolve() });
</script>
</body>
</html>
