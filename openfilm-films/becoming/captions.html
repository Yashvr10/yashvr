  document.body.append(e); els.push(o);
}
for (const c of D.chaps) {
  const e = document.createElement("div"); e.className = "chap"; e.innerHTML = `<div class="n">${c.num}</div><div class="t">${c.title}</div>`;
  document.body.append(e); els.push({ b: c, el: e, chap: true });
}
for (const c of D.ends || []) { const e = document.createElement("div"); e.className = "endc"; e.innerHTML = `<div>${c.text}</div>`; document.body.append(e); els.push({ b: c, el: e, chap: true }); }
// emphasis: sized so that, narrowed to 62%, it spans the frame (at most 680 px tall)
function layoutEmph(o) {
  o.el.style.display = "block";
  for (const l of o.el.querySelectorAll(".ln")) {
    l.style.fontSize = "100px"; l.style.transform = "none";
    const w = l.getBoundingClientRect().width;
    l.style.fontSize = Math.min(680, (100 * 1820) / (w * 0.62)) + "px";
    l.style.transform = "scaleX(.62)";
  }
  o.el.style.display = "none";
}
window.film = {
  ready: document.fonts.ready.then(() => els.filter((o) => !o.chap && o.b.kind === "emph").forEach(layoutEmph)),
  frame(t) {
    for (const o of els) {
      const on = t >= o.b.at && t < o.b.end;
      o.el.style.display = on ? "block" : "none";
      if (!on) continue;
      if (o.chap) { const k = Math.min(1, (t - o.b.at) / 0.6, (o.b.end - t) / 0.4); o.el.style.opacity = Math.max(0, k).toFixed(3); continue; }
      for (const [s, wt] of o.words) s.style.visibility = t >= wt ? "visible" : "hidden";
    }
  },
};
</script>
