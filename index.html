<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: "Inter Tight"; font-weight: 700; src: url(fonts/InterTight-700.woff2) format("woff2"); }
@font-face { font-family: "Inter"; font-weight: 400; src: url(fonts/Inter-400.woff2) format("woff2"); }
@font-face { font-family: "JetBrains Mono"; font-weight: 400; src: url(fonts/JetBrainsMono-400.woff2) format("woff2"); }
html,body{margin:0;background:#0b0b0f}canvas{display:block}
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script type="module">
import { FPS, fontLoads } from './tokens.js';
import { SCENES, DURATION, sceneAt } from './scenes/index.js';

const ctx = document.getElementById('c').getContext('2d');

// Pure function of t (seconds): clears and redraws everything, reads no clock or randomness.
window.renderFrame = (t) => {
  ctx.reset();
  const s = sceneAt(t);
  s.draw(ctx, t - s.start, s.dur);
};
window.DURATION = DURATION;
window.FPS = FPS;

for (const f of fontLoads) {
  if (!(await document.fonts.load(f)).length) throw new Error(`font did not load: ${f}`);
}
await document.fonts.ready;
await Promise.all(SCENES.map((s) => s.load?.()));
window.READY = true;

// Live preview only. The clock picks t; it never reaches renderFrame.
if (!new URLSearchParams(location.search).has('render')) {
  const t0 = performance.now();
  const loop = () => {
    window.renderFrame(((performance.now() - t0) / 1000) % DURATION);
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
