<!doctype html>
<html>
<head><meta charset="utf-8"><style>html,body{margin:0;background:#0b0b0f}canvas{display:block}</style></head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script type="module">
const ctx = document.getElementById('c').getContext('2d');

window.renderFrame = (t) => {
  ctx.fillStyle = '#0b0b0f';
  ctx.fillRect(0, 0, 1920, 1080);
  ctx.fillStyle = '#fff';
  ctx.font = '120px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('PIPELINE OK', 960, 540);
};

window.DURATION = 1;
window.FPS = 30;
await document.fonts.ready;
window.READY = true;
</script>
</body>
</html>
